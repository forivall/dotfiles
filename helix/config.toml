theme = "thursday"

# theme = "sonokai"
# theme = "tokyonight"

[editor]
line-number = "relative"
# cursorline = true
color-modes = true
insert-final-newline = true
# indent-style = 2

[editor.cursor-shape]
insert = "bar"

[editor.file-picker]
hidden = false
# git-ignore = false
# git-global = false
git-exclude = false

[editor.statusline]
right = [
  # default
  "diagnostics",
  # added
  "file-type",
  "file-indent-style",
  # default
  "selections",
  "register",
  "position",
  "file-encoding",
]


[keys.normal]
"#" = ":reflow"
# macos new terminal tab
"C-t" = ":sh it2api send-text $(it2api create-tab | sed -E -n 's/^.*\\bid=([0-9A-F-]+).*$/\\1/p') 'cd \"'\"$PWD\"'\" && cd %{buffer_name}\n'"
"C-A-o" = ":sh open '%{selection}'"
"C-y" = ":sh printf '%%s' '%{buffer_name}' | pbcopy"
# "A-[" = "move_prev_sub_word_end"
# "A-]" = "move_next_sub_word_start"
"C-left" = "move_prev_sub_word_start"
"C-right" = "move_next_sub_word_end"

[keys.normal."C-w"]
"c" = ":buffer-close"

[keys.normal.space.w]
"c" = ":buffer-close"

[keys.normal.space]
"C-o" = ":sh open '%{selection}'"
"C-g" = ":sh gh browse '%{buffer_name}' # 'L%{selection_line_start}-L%{selection_line_end}'"

[keys.insert]
"C-space" = "completion"

