theme = "thursday"

# theme = "sonokai"
# theme = "tokyonight"

[editor]
line-number = "relative"
# cursorline = true
color-modes = true
insert-final-newline = true
# indent-style = 2

[editor.cursor-shape]
insert = "bar"

[editor.file-picker]
hidden = false
# git-ignore = false
# git-global = false
git-exclude = false

[editor.statusline]
right = [
  # default
  "diagnostics",
  # added
  "file-type",
  "file-indent-style",
  # default
  "selections",
  "register",
  "position",
  "file-encoding",
]


[keys.normal]
"#" = ":reflow"
# macos new terminal tab
"C-t" = ":sh it2split cd \"%{buffer_name}\""
"C-A-o" = ":sh open '%{selection}'"
"C-y" = ":sh printf '%%s' '%{buffer_name}' | pbcopy"
# "A-[" = "move_prev_sub_word_end"
# "A-]" = "move_next_sub_word_start"
"C-left" = "move_prev_sub_word_start"
"C-right" = "move_next_sub_word_end"
"A-F4" = ":buffer-close"

[keys.normal."C-w"]
"c" = ":buffer-close"

[keys.normal.space.w]
"c" = ":buffer-close"

[keys.normal.space]
"C-o" = ":sh open '%{selection}'"
"C-g" = ":sh gh bf '%{buffer_name}' 'L%{selection_line_start}-L%{selection_line_end}'"
"C-G" = ":sh git diffd ${HELIX_GIT_HEAD:-HEAD} -- '%{buffer_name}'"
"x" = ":sh gh pr-file-viewed '%{buffer_name}'"
"X" = ":sh gh pr-file-unviewed-gql '%{buffer_name}'"
"L" = ":sh it2split --no-focus git logd -w -L'%{selection_line_start},%{selection_line_end}:%{buffer_name}'"
"C-l" = ":sh it2split --no-focus git diffd -w $HELIX_GIT_HEAD -- '%{buffer_name}'"
"u" = ":sh gh pfh '%{buffer_name}' 'R%{selection_line_start}-R%{selection_line_end}'"
"C-u" = ":sh gh browse '%{buffer_name}:%{selection_line_start}'"
"C-v" = ":sh it2split --no-focus gh pr-unresolved-comments-file '%{buffer_name}'"
"t" = ":sh jest-toplevel --in-terminal-split '%{buffer_name}'"

[keys.insert]
"C-space" = "completion"

