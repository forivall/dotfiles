theme = "thursday"

# theme = "sonokai"
# theme = "tokyonight"

[editor]
line-number = "relative"
# cursorline = true
color-modes = true
insert-final-newline = true

[editor.cursor-shape]
insert = "bar"

[keys.normal]
"#" = ":reflow"
# macos new terminal tab
"C-t" = ":sh it2api send-text $(it2api create-tab | sed -E -n 's/^.*\\bid=([0-9A-F-]+).*$/\\1/p') 'cd \"'\"$PWD\"'/%{buffer_name}\"\n'"

[keys.insert]
"C-space" = "completion"

[editor.file-picker]
hidden = false
# git-ignore = false
# git-global = false
git-exclude = false

