# basic .paneru.toml
[options]
focus_follows_mouse = false
mouse_follows_focus = false
# animation_speed = 32
animation_speed = 16
preset_column_widths = [
  0.21,
  0.27,
  0.33,
  0.39,
  0.45,
  0.51,
  0.57,
  0.63,
  0.69,
  0.75,
  0.81,
  0.87,
  0.93,
  0.97,
]
sliver_width = 5

[bindings]
window_focus_west = "cmd + alt + ctrl - h"
window_focus_east = "cmd + alt + ctrl- l"
window_focus_south = "cmd + alt + ctrl - j"
window_focus_north = "cmd + alt + ctrl - k"
window_swap_west = "cmd + alt + shift + ctrl - h"
window_swap_east = "cmd + alt + shift + ctrl - l"
window_grow = "cmd + alt - f12"
window_shrink = "cmd + alt - f11"
window_manage = "cmd + alt - f9"
window_nextdisplay = "cmd + alt - f8"
# window_resize = "alt - r"
window_center = "cmd + alt - f10"
window_stack = "cmd + shift - k"
window_unstack = "cmd + shift - j"
quit = "ctrl + alt - q"

[windows]

[windows.pip]
title = "Picture.*(in)?.*[Pp]icture"
floating = true

[windows.hotkey]
title = "^$"
bundle_id = "com.googlecode.iterm2"
floating = true

[windows.passwords]
# Floating window placed on a grid. The format is "cols:rows:x:y:w:h".
# This divides the display into a 6x6 grid and places the window at cell (1,1)
# spanning 4 columns and 4 rows — roughly centered covering 2/3 of the display.
title = "Passwords.*"
floating = true
grid = "6:6:1:1:4:4"# [padding]

# left = 75

[swipe]
sensitivity = 0.3
[swipe.gesture]
fingers_count = 3
direction = "Natural"
# direction = "Reversed"

[swipe.scroll]
modifier = "alt + cmd"
