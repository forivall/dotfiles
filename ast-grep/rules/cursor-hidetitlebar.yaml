id: cursor-hidetitlebar
language: JavaScript
rule:
  kind: function_declaration
  pattern: |
    function $NAME($CONFIGSVC,$WINDOW,$MENUBARTOGGLED) {
      if (!$HASCUSTOMTITLEBAR($CONFIGSVC)) return !1;
      if ($WINDOW.document.body.classList.contains($CLASSNAME)) return !0;
      const $INFULLSCREEN = $ISFULLSCREEN($WINDOW), $NATIVETITLEBARENABLED = $HASNATIVETITLEBAR($CONFIGSVC);
      if (!$ISTITLEBAREMPTY($CONFIGSVC)) return !0;
      if ($NATIVETITLEBARENABLED) return !1;
      $$$REST
    }
fix: 'function
  $NAME($CONFIGSVC,$WINDOW,$MENUBARTOGGLED){if(!$HASCUSTOMTITLEBAR($CONFIGSVC))return!1;if($WINDOW.document.body.classList.contains($CLASSNAME))return!0;const
  $INFULLSCREEN=$ISFULLSCREEN($WINDOW),$NATIVETITLEBARENABLED=$HASNATIVETITLEBAR($CONFIGSVC);if($NATIVETITLEBARENABLED&&$CONFIGSVC.getValue("window.customTitleBarVisibility")==="never")return!1;if(!$ISTITLEBAREMPTY($CONFIGSVC))return!0;if($NATIVETITLEBARENABLED)return!1;$$$REST}'
